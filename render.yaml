services:
  # ── Express / Prisma backend ─────────────────────────────────────────────
  - type: web
    name: okkar-api
    env: node
    rootDir: server
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        sync: false          # secret — set in Render dashboard, never commit
      - key: CLIENT_ORIGIN
        value: https://okkar.onrender.com

  # ── React / Vite frontend (static site) ──────────────────────────────────
  - type: web
    name: okkar
    env: static
    rootDir: client
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://okkar-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
