services:
  # Single web service — Express serves both the API and the built React app
  - type: web
    name: okkar
    env: node
    plan: free
    buildCommand: npm run render-build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        sync: false    # set in Render dashboard — never commit this value
      - key: CLIENT_ORIGIN
        value: https://okkar.onrender.com
