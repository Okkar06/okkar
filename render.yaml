services:
  - type: web
    name: okkar-portfolio-api
    runtime: node
    rootDir: server
    buildCommand: npm install && npm run prisma:generate
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PORT
        value: 4000
      - key: CLIENT_ORIGIN
        sync: false

  - type: static
    name: okkar-portfolio-client
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
