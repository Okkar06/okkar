services:
  # Single web service — Express serves both the API and the built React app.
  - type: web
    name: okkar
    env: node
    plan: free
    buildCommand: npm run render-build
    startCommand: npm start
    # Render polls this to decide whether a deploy is live and whether a
    # running instance needs restarting. It is exempt from the rate limiter.
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000

      # Set in the Render dashboard — never commit this value.
      - key: DATABASE_URL
        sync: false

      # Browser origins allowed to call the API. Never "*".
      - key: ALLOWED_ORIGINS
        value: https://okkar.onrender.com

      # Render puts exactly one proxy in front of the service, so client IPs
      # (and therefore the rate limiters) resolve correctly.
      - key: TRUST_PROXY
        value: 1

      - key: JSON_BODY_LIMIT
        value: 10kb
      - key: API_RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: API_RATE_LIMIT_MAX
        value: 300
      - key: CONTACT_RATE_LIMIT_WINDOW_MS
        value: 3600000
      - key: CONTACT_RATE_LIMIT_MAX
        value: 5
