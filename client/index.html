<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/Code-Slash--Streamline-Bootstrap.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Okkar Hein — Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
    <script>
      (function () {
        var themes = {
          violet:  { rgb: '91 66 245',   hex: '#5b42f5' },
          sky:     { rgb: '14 165 233',  hex: '#0ea5e9' },
          cyan:    { rgb: '6 182 212',   hex: '#06b6d4' },
          emerald: { rgb: '16 185 129',  hex: '#10b981' },
          rose:    { rgb: '244 63 94',   hex: '#f43f5e' },
          amber:   { rgb: '245 158 11',  hex: '#f59e0b' },
        }
        try {
          var saved = localStorage.getItem('accent-theme')
          var t = (saved && themes[saved]) ? themes[saved] : themes.violet
          document.documentElement.style.setProperty('--accent', t.rgb)
          document.addEventListener('DOMContentLoaded', function () {
            document.querySelectorAll('.loader-accent').forEach(function (el) {
              el.style.color = t.hex
            })
            document.querySelectorAll('.loader-dots span, .loader-bar-fill').forEach(function (el) {
              el.style.background = t.hex
            })
          })
        } catch (_) {}
      })()
    </script>
  <style>
    #app-loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #f4f4ff;
      gap: 1.75rem;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }
    #app-loader.fade-out {
      opacity: 0;
      visibility: hidden;
    }

    /* Name */
    .loader-name {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      font-size: clamp(1.75rem, 5vw, 2.75rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      color: #08081e;
      position: relative;
      overflow: hidden;
    }
    .loader-name::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.72) 50%, transparent 100%);
      background-size: 200% 100%;
      animation: loader-shimmer 1.7s ease-in-out infinite;
    }
    @keyframes loader-shimmer {
      0%   { background-position: -200% center; }
      100% { background-position:  200% center; }
    }
    .loader-accent { color: #5b42f5; }

    /* Subtitle */
    .loader-sub {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: rgba(8,8,30,0.32);
      margin-top: -0.75rem;
    }

    /* Progress bar */
    .loader-bar {
      width: clamp(160px, 28vw, 220px);
      height: 3px;
      background: rgba(8,8,30,0.08);
      border-radius: 99px;
      overflow: hidden;
    }
    .loader-bar-fill {
      height: 100%;
      width: 0%;
      background: #5b42f5;
      border-radius: 99px;
      animation: loader-progress 28s cubic-bezier(0.1, 0.4, 0.6, 1) forwards;
    }
    /* Fast start, gradual crawl, finishes at 100% by ~30 s */
    @keyframes loader-progress {
      0%   { width: 0%; }
      5%   { width: 28%; }
      15%  { width: 50%; }
      35%  { width: 68%; }
      60%  { width: 82%; }
      80%  { width: 92%; }
      100% { width: 100%; }
    }

    /* Bouncing dots */
    .loader-dots {
      display: flex;
      gap: 7px;
      align-items: center;
    }
    .loader-dots span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #5b42f5;
      opacity: 0.2;
      animation: loader-bounce 1.25s ease-in-out infinite;
    }
    .loader-dots span:nth-child(1) { animation-delay: 0s; }
    .loader-dots span:nth-child(2) { animation-delay: 0.2s; }
    .loader-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes loader-bounce {
      0%, 80%, 100% { opacity: 0.2; transform: scale(0.85); }
      40%           { opacity: 1;   transform: scale(1.25); }
    }

    /* Hint message — fades in after 4 s if still loading */
    .loader-hint {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      font-size: 0.7rem;
      color: rgba(8,8,30,0.3);
      text-align: center;
      line-height: 1.6;
      opacity: 0;
      animation: loader-hint-in 0.7s ease forwards;
      animation-delay: 4s;
      margin-top: -0.5rem;
    }
    @keyframes loader-hint-in {
      to { opacity: 1; }
    }
  </style>
  </head>
  <body>
    <div id="app-loader">
      <p class="loader-name">Okkar <span class="loader-accent">Hein</span></p>
      <p class="loader-sub">Portfolio</p>
      <div class="loader-bar"><div class="loader-bar-fill"></div></div>
      <div class="loader-dots">
        <span></span><span></span><span></span>
      </div>
      <p class="loader-hint">Server is waking up · This can take up to 30 s on first visit</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
