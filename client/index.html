<!doctype html>
<html lang="en" data-mode="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Okkar Hein — Full-stack Developer</title>
    <meta
      name="description"
      content="Portfolio of Okkar Hein, a full-stack developer in Singapore building clean interfaces and reliable APIs."
    />
    <meta name="theme-color" content="#05060f" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />

    <!-- External (not inline) so the CSP can keep script-src 'self'. -->
    <script src="/theme-init.js"></script>
    <link rel="stylesheet" href="/loader.css" />
  </head>
  <body>
    <!-- Arcade loader: the mascot chomps along the pellet line, then the
         cabinet boots. main.jsx fades this out and fires `loader-done`. -->
    <div id="app-loader" role="status" aria-live="polite" aria-label="Loading portfolio">
      <p class="loader-title">Okkar <em>Hein</em></p>
      <p class="loader-sub">Insert Coin</p>

      <div class="loader-track">
        <div class="loader-pellets" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span><span></span>
        </div>
        <div class="loader-runner" aria-hidden="true">
          <svg viewBox="0 0 64 64" focusable="false">
            <path class="loader-jaw" d="M32 32 L58 32 A26 26 0 0 0 6 32 Z" />
            <path class="loader-jaw loader-jaw-bottom" d="M32 32 L58 32 A26 26 0 0 1 6 32 Z" />
            <path class="loader-gear" d="M9 29 A23 23 0 0 1 49 15" fill="none" stroke-width="4" stroke-linecap="round" />
            <rect class="loader-gear-fill" x="2" y="25" width="10" height="15" rx="5" />
            <circle class="loader-eye" cx="37" cy="19" r="3.6" />
          </svg>
        </div>
      </div>

      <p class="loader-hint">Server is waking up · this can take up to 30 s on a first visit</p>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
